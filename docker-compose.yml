version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SECRET_KEY=${SECRET_KEY:-getsatgo-production-secret-key-change-me}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-getsatgo}:${POSTGRES_PASSWORD:-getsatgopass}@db:5432/${POSTGRES_DB:-getsatgo_db}
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-getsatgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-getsatgopass}
      POSTGRES_DB: ${POSTGRES_DB:-getsatgo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-getsatgo} -d ${POSTGRES_DB:-getsatgo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:

